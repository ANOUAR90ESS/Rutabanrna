<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#trainGrad)" stroke-width="4" opacity="0.3"/>

  <!-- 3D Rails in perspective -->
  <path d="M 80 430 L 220 280 L 292 280 L 432 430" fill="none" stroke="url(#railGrad)" stroke-width="12" stroke-linecap="round"/>
  <line x1="130" y1="390" x2="382" y2="390" stroke="#475569" stroke-width="8"/>
  <line x1="170" y1="350" x2="342" y2="350" stroke="#475569" stroke-width="7"/>
  <line x1="205" y1="315" x2="307" y2="315" stroke="#475569" stroke-width="6"/>

  <!-- 3D Train Front Body -->
  <path d="M 180 140 C 180 100, 332 100, 332 140 L 348 270 C 348 300, 312 320, 256 320 C 200 320, 164 300, 164 270 Z" fill="#f8fafc"/>
  
  <!-- Red Aerodynamic Accent & Grille -->
  <path d="M 164 260 C 164 295, 200 315, 256 315 C 312 315, 348 295, 348 260 L 344 230 C 310 242, 202 242, 168 230 Z" fill="#e11d48"/>

  <!-- Windshield -->
  <path d="M 194 150 C 210 135, 302 135, 318 150 L 324 205 C 290 215, 222 215, 188 205 Z" fill="#0f172a"/>
  <!-- Windshield Reflection -->
  <path d="M 200 155 L 235 155 L 225 195 L 195 195 Z" fill="#38bdf8" opacity="0.6"/>

  <!-- Headlights with Glow -->
  <circle cx="204" cy="275" r="14" fill="#fef08a"/>
  <circle cx="308" cy="275" r="14" fill="#fef08a"/>
  <circle cx="204" cy="275" r="24" fill="#fef08a" opacity="0.25"/>
  <circle cx="308" cy="275" r="24" fill="#fef08a" opacity="0.25"/>

  <!-- Roof Pantograph -->
  <path d="M 230 100 L 256 60 L 282 100 M 240 60 L 272 60" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
</svg>
